<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b12"><title>Portfolio Admin — LEOOSTORE.id</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><style>
.admin-wrap{max-width:1050px;margin:0 auto;padding:42px 20px}.admin-panel{background:linear-gradient(145deg,#171a29,#0e1119);border:1px solid var(--line);border-radius:16px;padding:28px;margin:18px 0}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.admin-wrap h1,.admin-wrap h2{font-family:var(--display)}.admin-wrap h1{font-size:34px;margin:8px 0}.admin-wrap p{color:#a2a8b8}.admin-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.admin-form label{display:grid;gap:6px;color:#cbd0df;font-size:12px}.admin-form input,.admin-form select,.admin-form textarea{width:100%;background:#090d18;border:1px solid var(--line);border-radius:8px;color:#fff;padding:12px;font:inherit}.admin-form textarea{min-height:90px;resize:vertical}.admin-form .wide{grid-column:1/-1}.admin-btn{border:1px solid var(--line);background:#a78bfa;color:#100d1b;padding:11px 16px;border-radius:8px;font-weight:700;cursor:pointer}.admin-btn.secondary{background:#1a2030;color:#eee}.admin-btn.danger{background:#3b1821;color:#ffb7c2}.admin-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.admin-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.admin-item small{display:block;color:#9ba2b5}.admin-status{font-size:12px;color:#a995f4;min-height:22px}.hidden{display:none!important}.admin-thumb{width:54px;height:42px;object-fit:cover;border-radius:6px}.admin-check{display:flex!important;align-items:center;gap:8px!important}.admin-check input{width:auto}.auth-box{max-width:460px;margin:9vh auto}.admin-toplink{color:#c4b6ff;font-size:12px}@media(max-width:650px){.admin-form{grid-template-columns:1fr}.admin-form .wide{grid-column:auto}.admin-panel{padding:20px}.admin-wrap{padding:24px 14px}}
</style></head><body><main class="admin-wrap">
<div class="admin-head"><div><div class="eyebrow">LEOOSTORE.ID / CONTROL CENTER</div><h1>Portfolio admin<span class="gradient-text">.</span></h1><p>Kelola project yang tampil di halaman portfolio.</p></div><a class="admin-toplink" href="index.html">← Public portfolio</a></div>
<section id="authPanel" class="admin-panel auth-box"><h2>Admin access</h2><p>Gunakan email yang sudah diizinkan sebagai admin.</p><form id="authForm" class="admin-form"><label class="wide">Email<input id="authEmail" type="email" autocomplete="email" required value="leovbriansyh791@gmail.com"></label><label class="wide">Password<input id="authPassword" type="password" autocomplete="current-password" minlength="10" required></label><div class="wide admin-row"><button class="admin-btn" type="submit" id="loginBtn">Login</button><button class="admin-btn secondary" type="button" id="signupBtn">Buat akun admin</button></div></form><div id="authStatus" class="admin-status" role="status"></div></section>
<section id="dashboard" class="hidden">
<div class="admin-panel"><div class="admin-head"><div><h2 id="formTitle">Tambah project</h2><p>Foto maksimal 5 MB. Format JPG, PNG, atau WebP.</p></div><button id="logoutBtn" class="admin-btn secondary">Logout</button></div>
<form id="projectForm" class="admin-form">
<input type="hidden" id="projectId"><input type="hidden" id="oldImage">
<label>Nama project<input id="name" required maxlength="90"></label><label>Slug<input id="slug" required maxlength="90" placeholder="nama-project"></label>
<label>Kategori<select id="category"><option value="ecommerce">E-commerce</option><option value="business">Business tools</option><option value="web">Website</option></select></label><label>Status<select id="status"><option>In development</option><option>Live</option><option>Completed</option></select></label>
<label class="wide">Deskripsi<textarea id="description" maxlength="500"></textarea></label><label class="wide">URL project<input id="url" type="url" placeholder="https://"></label>
<label class="wide">Thumbnail<input id="image" type="file" accept="image/png,image/jpeg,image/webp"></label>
<label>Urutan tampil<input id="sortOrder" type="number" value="0"></label><label class="admin-check"><input id="featured" type="checkbox"> Featured project</label><label class="admin-check"><input id="published" type="checkbox" checked> Tampilkan di website</label>
<div class="wide admin-row"><button class="admin-btn" type="submit">Simpan project</button><button class="admin-btn secondary" type="button" id="resetBtn">Reset form</button></div></form><div id="saveStatus" class="admin-status" role="status"></div></div>
<div class="admin-panel"><h2>Daftar project</h2><div id="projectList">Memuat data...</div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://bxsvpwgaeeocpefaukkq.supabase.co";
const SUPABASE_KEY="sb_publishable_7pAX9I2gbAGPNoHcboD-8w_v5vZbsKx";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const categoryLabels={ecommerce:"E-commerce",business:"Business tools",web:"Website"};
let currentUser=null;
function status(el,msg){$(el).textContent=msg}
function slugify(v){return v.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
async function checkSession(){const {data:{session}}=await db.auth.getSession();if(session){currentUser=session.user;await verifyAdmin()}else showAuth()}
function showAuth(){ $("authPanel").classList.remove("hidden");$("dashboard").classList.add("hidden")}
async function verifyAdmin(){const {data,error}=await db.from("portfolio_admins").select("user_id").eq("user_id",currentUser.id).maybeSingle();if(error||!data){await db.auth.signOut();currentUser=null;showAuth();status("authStatus","Akun ini belum terdaftar sebagai admin.");return} $("authPanel").classList.add("hidden");$("dashboard").classList.remove("hidden");loadProjects()}
$("authForm").addEventListener("submit",async e=>{e.preventDefault();status("authStatus","Memproses login...");const {data,error}=await db.auth.signInWithPassword({email:$("authEmail").value.trim(),password:$("authPassword").value});if(error){status("authStatus",error.message);return}currentUser=data.user;await verifyAdmin()});
$("signupBtn").addEventListener("click",async()=>{const email=$("authEmail").value.trim(),password=$("authPassword").value;if(!email||password.length<10){status("authStatus","Isi email dan password minimal 10 karakter.");return}status("authStatus","Membuat akun...");const {data,error}=await db.auth.signUp({email,password});if(error){status("authStatus",error.message);return}status("authStatus",data.session?"Akun dibuat. Memeriksa akses admin...":"Akun dibuat. Cek email untuk konfirmasi, lalu login.");if(data.session){currentUser=data.user;await verifyAdmin()}});
$("logoutBtn").onclick=async()=>{await db.auth.signOut();currentUser=null;showAuth()};
$("name").addEventListener("input",()=>{if(!$("projectId").value)$("slug").value=slugify($("name").value)});
$("resetBtn").onclick=()=>{$("projectForm").reset();$("projectId").value="";$("oldImage").value="";$("formTitle").textContent="Tambah project";$("published").checked=true};
async function loadProjects(){const {data,error}=await db.from("portfolio_projects").select("*").order("sort_order").order("created_at",{ascending:false});if(error){$("projectList").textContent=error.message;return}$("projectList").innerHTML=data.length?data.map(p=>'<div class="admin-item"><div><strong>'+esc(p.name)+'</strong><small>'+esc(p.category_label)+' · '+esc(p.status)+' · '+(p.is_published?"Published":"Hidden")+'</small></div><div class="admin-row"><button class="admin-btn secondary" data-edit="'+p.id+'">Edit</button><button class="admin-btn danger" data-delete="'+p.id+'">Hapus</button></div></div>').join(""):"Belum ada project."}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("projectList").addEventListener("click",async e=>{const edit=e.target.dataset.edit,del=e.target.dataset.delete;if(edit){const {data}=await db.from("portfolio_projects").select("*").eq("id",edit).single();if(!data)return;$("projectId").value=data.id;$("oldImage").value=data.image_path||"";$("name").value=data.name;$("slug").value=data.slug;$("category").value=data.category;$("status").value=data.status;$("description").value=data.description;$("url").value=data.url;$("sortOrder").value=data.sort_order;$("featured").checked=data.featured;$("published").checked=data.is_published;$("formTitle").textContent="Edit project";window.scrollTo({top:0,behavior:"smooth"})}if(del&&confirm("Hapus project ini?")){const {data}=await db.from("portfolio_projects").select("image_path").eq("id",del).single();const {error}=await db.from("portfolio_projects").delete().eq("id",del);if(error){status("saveStatus",error.message);return}if(data?.image_path)await db.storage.from("portfolio-projects").remove([data.image_path]);loadProjects()}});
$("projectForm").addEventListener("submit",async e=>{e.preventDefault();status("saveStatus","Menyimpan...");let imagePath=$("oldImage").value;const file=$("image").files[0];if(file){if(file.size>5*1024*1024){status("saveStatus","Foto melebihi 5 MB.");return}if(!["image/jpeg","image/png","image/webp"].includes(file.type)){status("saveStatus","Format foto tidak didukung.");return}const path=crypto.randomUUID()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"-");const {error:upErr}=await db.storage.from("portfolio-projects").upload(path,file,{upsert:false,contentType:file.type});if(upErr){status("saveStatus",upErr.message);return}imagePath=path}
const statusValue=$("status").value;const payload={name:$("name").value.trim(),slug:slugify($("slug").value),category:$("category").value,category_label:categoryLabels[$("category").value],description:$("description").value.trim(),status:statusValue,status_type:statusValue==="Live"?"live":statusValue==="Completed"?"completed":"progress",url:$("url").value.trim(),image_path:imagePath||null,featured:$("featured").checked,is_published:$("published").checked,sort_order:Number($("sortOrder").value)||0,updated_at:new Date().toISOString()};
const id=$("projectId").value;const result=id?await db.from("portfolio_projects").update(payload).eq("id",id):await db.from("portfolio_projects").insert(payload);if(result.error){status("saveStatus",result.error.message);return}status("saveStatus","Project berhasil disimpan.");$("resetBtn").click();loadProjects()});
db.auth.onAuthStateChange((_event,session)=>{if(!session){currentUser=null;showAuth()}});
checkSession();
</script></body></html>
