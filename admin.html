<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b12"><title>Portfolio Admin — LEOOSTORE.id</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><style>
.admin-wrap{max-width:1050px;margin:0 auto;padding:30px 20px}.admin-panel{background:linear-gradient(145deg,#171a29,#0e1119);border:1px solid var(--line);border-radius:16px;padding:26px;margin:18px 0}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.admin-wrap h2{font:600 23px var(--display);margin:0 0 8px}.admin-wrap p{color:#a2a8b8;margin:0 0 18px}.admin-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.admin-form label,.category-form label{display:grid;gap:6px;color:#cbd0df;font-size:12px}.admin-form input:not([type=checkbox]):not([type=file]),.admin-form select,.admin-form textarea,.category-form input{width:100%;background:#090d18;border:1px solid #35394d;border-radius:8px;color:#f5f4ff;padding:12px;font:inherit;color-scheme:dark}.admin-form select option{background:#111522;color:#f5f4ff}.admin-form textarea{min-height:76px;resize:vertical}.admin-form .wide{grid-column:1/-1}.admin-btn{border:1px solid #8d79db;background:#a78bfa;color:#100d1b;padding:10px 15px;border-radius:8px;font-weight:700;cursor:pointer}.admin-btn.secondary{background:#1a2030;border-color:var(--line);color:#eee}.admin-btn.danger{background:#3b1821;border-color:#67313e;color:#ffb7c2}.admin-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.admin-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.admin-item small{display:block;color:#9ba2b5}.admin-status{font-size:12px;color:#a995f4;min-height:22px;margin-top:10px}.hidden{display:none!important}.admin-check{display:flex!important;align-items:center;gap:9px!important;background:#111522;border:1px solid var(--line);padding:12px;border-radius:8px}.admin-check input{accent-color:#a78bfa;width:16px;height:16px}.auth-box{max-width:460px;margin:8vh auto}.admin-toplink{color:#c4b6ff;font-size:12px}.preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:10px;margin-top:12px}.preview-card{position:relative;aspect-ratio:4/3;border:1px solid #45415d;border-radius:9px;overflow:hidden;background:#090d18}.preview-card img{width:100%;height:100%;object-fit:cover}.preview-card span{position:absolute;bottom:0;left:0;right:0;padding:4px 7px;background:#080a10c9;color:white;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview-card button{position:absolute;top:5px;right:5px;border:0;border-radius:50%;width:23px;height:23px;background:#3b1821;color:#fff;cursor:pointer}.admin-live-preview{max-width:560px;margin-top:12px;border:1px solid #7563ae;border-radius:13px;overflow:hidden;background:#10131f}.admin-live-preview .live-photo{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.admin-live-preview .live-info{padding:18px}.admin-live-preview .live-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#a99be0;font-size:11px;margin-bottom:18px}.admin-live-preview h3{font:700 24px var(--display);margin:0 0 8px}.admin-live-preview p{color:#a2a8b8;font-size:13px;line-height:1.7;margin:0 0 12px}.admin-live-preview .live-price{font-size:12px;color:#cfc5ff;margin-top:18px}.preview-hint{font-size:11px;color:#a2a8b8;margin:8px 0 0}.category-form{display:grid;grid-template-columns:1fr auto;gap:9px;margin:12px 0}.category-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.category-row input{min-width:0;flex:1;background:#090d18;border:1px solid #35394d;border-radius:7px;color:#fff;padding:9px;color-scheme:dark}.muted-note{font-size:11px;color:#9298aa;margin-top:5px}.admin-item .admin-row{justify-content:flex-end}@media(max-width:650px){.admin-form{grid-template-columns:1fr}.admin-form .wide{grid-column:auto}.admin-panel{padding:19px}.admin-wrap{padding:22px 13px}.category-form{grid-template-columns:1fr auto}}
</style></head><body><main class="admin-wrap">
<div class="admin-head"><a class="admin-toplink" href="index.html">← Public portfolio</a></div>
<section id="authPanel" class="admin-panel auth-box"><h2>Admin access</h2><p>Login untuk mengelola portfolio.</p><form id="authForm" class="admin-form"><label class="wide">Email<input id="authEmail" type="email" autocomplete="email" required value="leovbriansyah791@gmail.com"></label><label class="wide">Password<input id="authPassword" type="password" autocomplete="current-password" minlength="10" required></label><div class="wide admin-row"><button class="admin-btn" type="submit">Login</button><button class="admin-btn secondary" type="button" id="signupBtn">Buat akun admin</button></div></form><div id="authStatus" class="admin-status" role="status"></div></section>
<section id="dashboard" class="hidden">
<div class="admin-panel"><div class="admin-head"><h2 id="formTitle">Tambah project</h2><button id="logoutBtn" class="admin-btn secondary">Logout</button></div>
<form id="projectForm" class="admin-form">
<input type="hidden" id="projectId"><input type="hidden" id="oldImages">
<label>Nama project<input id="name" required maxlength="90"></label><label>Slug<input id="slug" required maxlength="90" placeholder="nama-project"></label>
<label>Kategori<select id="category" required></select></label><label>Status<select id="status"><option>In development</option><option>Live</option><option>Completed</option></select></label>
<label class="wide">Deskripsi / ringkasan project <span class="muted-note">(opsional)</span><textarea id="description" placeholder="Tulis deskripsi project sepanjang yang dibutuhkan. Paragraf dan baris baru akan dipertahankan."></textarea><small class="muted-note">Tidak ada batas karakter dari form admin.</small></label><label>Harga minimum (Rp)<input id="priceMin" type="number" min="0" step="1000" placeholder="100000"></label><label>Harga maksimum (Rp)<input id="priceMax" type="number" min="0" step="1000" placeholder="1500000"></label><label class="admin-check wide"><input id="showPrice" type="checkbox"> Tampilkan harga di card project</label><label class="wide">URL project <span class="muted-note">(opsional)</span><input id="url" type="url" placeholder="https://"></label>
<label class="wide">Foto project <span class="muted-note">Pilih 1–15 foto. Maksimal 5 MB per foto · JPG, PNG, WebP.</span><input id="images" type="file" accept="image/png,image/jpeg,image/webp" multiple></label>
<div class="wide"><div class="muted-note" id="previewCount">Preview foto (0/15)</div><div class="preview-grid" id="imagePreview"></div><div class="preview-hint">Preview di bawah memperlihatkan perkiraan tampilan card di halaman utama. Hapus foto dengan tombol ×, lalu pilih foto pengganti jika diperlukan.</div><div class="admin-live-preview" id="projectLivePreview"></div></div>
<label>Rasio foto<select id="imageAspectRatio"><option value="16:9">16:9 · Landscape</option><option value="9:16">9:16 · Portrait</option><option value="1:1">1:1 · Square</option></select></label><label>Urutan tampil<input id="sortOrder" type="number" value="0"></label>
<label class="admin-check"><input id="privateProject" type="checkbox"> Project privat</label>
<label class="admin-check"><input id="published" type="checkbox" checked> Tampilkan di website</label>
<div class="wide admin-row"><button class="admin-btn" type="submit">Simpan project</button><button class="admin-btn secondary" type="button" id="resetBtn">Reset form</button></div></form><div id="saveStatus" class="admin-status" role="status"></div></div>
<div class="admin-panel"><div class="admin-head"><h2>Kelola kategori</h2></div><form id="categoryForm" class="category-form"><input id="newCategory" maxlength="40" placeholder="Nama kategori baru" required><button class="admin-btn" type="submit">Tambah</button></form><div id="categoryList"></div><div id="categoryStatus" class="admin-status"></div></div>
<div class="admin-panel"><h2>Daftar project</h2><div id="projectList">Memuat data...</div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://bxsvpwgaeeocpefaukkq.supabase.co",SUPABASE_KEY="sb_publishable_7pAX9I2gbAGPNoHcboD-8w_v5vZbsKx";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id);
let currentUser=null,categories=[],existingImages=[],newFiles=[],previewUrls=[];
const say=(id,msg)=>$(id).textContent=msg;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slugify=v=>v.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function showAuth(){$("authPanel").classList.remove("hidden");$("dashboard").classList.add("hidden")}
async function verifyAdmin(){const {data,error}=await db.from("portfolio_admins").select("user_id").eq("user_id",currentUser.id).maybeSingle();if(error||!data){await db.auth.signOut();currentUser=null;showAuth();say("authStatus","Akun ini belum terdaftar sebagai admin.");return} $("authPanel").classList.add("hidden");$("dashboard").classList.remove("hidden");await loadCategories();loadProjects()}
async function checkSession(){const {data:{session}}=await db.auth.getSession();if(session){currentUser=session.user;await verifyAdmin()}else showAuth()}
$("authForm").addEventListener("submit",async e=>{e.preventDefault();say("authStatus","Memproses login...");const {data,error}=await db.auth.signInWithPassword({email:$("authEmail").value.trim(),password:$("authPassword").value});if(error){say("authStatus",error.message);return}currentUser=data.user;await verifyAdmin()});
$("signupBtn").onclick=async()=>{const email=$("authEmail").value.trim(),password=$("authPassword").value;if(!email||password.length<10){say("authStatus","Isi email dan password minimal 10 karakter.");return}say("authStatus","Membuat akun...");const {data,error}=await db.auth.signUp({email,password});if(error){say("authStatus",error.message);return}say("authStatus",data.session?"Akun dibuat. Memeriksa akses admin...":"Akun dibuat. Cek email untuk konfirmasi, lalu login.");if(data.session){currentUser=data.user;await verifyAdmin()}};
$("logoutBtn").onclick=async()=>{await db.auth.signOut();currentUser=null;showAuth()};
$("name").addEventListener("input",()=>{if(!$("projectId").value)$("slug").value=slugify($("name").value)});
function storageUrl(path){return db.storage.from("portfolio-projects").getPublicUrl(path).data.publicUrl}
function renderPreview(){const items=[...existingImages.map((p,i)=>({url:storageUrl(p),name:"Foto tersimpan",existing:true,index:i})),...newFiles.map((f,i)=>({url:previewUrls[i],name:f.name,existing:false,index:i}))];$("previewCount").textContent="Preview foto ("+items.length+"/15)";$("imagePreview").innerHTML=items.map(x=>'<div class="preview-card"><img src="'+esc(x.url)+'" alt="'+esc(x.name)+'"><span>'+esc(x.name)+'</span><button type="button" data-remove="'+(x.existing?"old":"new")+'" data-index="'+x.index+'" aria-label="Hapus foto">×</button></div>').join("");renderLivePreview(items)}
function renderLivePreview(items=[]){const box=$("projectLivePreview");if(!box)return;const name=$("name").value.trim()||"Nama project";const desc=$("description").value.trim().split(/\\r?\\n/).filter(line=>line.trim()&&line.trim()!=="Panduan Penggunaan DashboardOwner").join(" ").slice(0,190);const category=$("category").selectedOptions[0]?.textContent||"Kategori";const status=$("status").value;const min=$("priceMin").value,max=$("priceMax").value;const price=$("showPrice").checked&&min!==""&&max!==""?'<div class="live-price">Price: Rp'+Number(min).toLocaleString("id-ID")+' – Rp'+Number(max).toLocaleString("id-ID")+'</div>':"";const image=items[0]?.url;const ratio=$("imageAspectRatio").value;box.innerHTML=(image?'<img class="live-photo" src="'+esc(image)+'" alt="Preview foto project" style="aspect-ratio:'+ratio.replace(":","/")+'">':'<div class="live-photo" style="aspect-ratio:'+ratio.replace(":","/")+';display:grid;place-items:center;color:#a99be0;background:#191d2c">Preview foto project</div>')+'<div class="live-info"><div class="live-meta"><span>'+esc(category)+'</span><span>'+esc(status)+'</span></div><h3>'+esc(name)+'</h3><p>'+esc(desc||"Ringkasan project akan tampil di sini.")+'</p><div style="color:#b8a5ff;font-size:12px;font-weight:700">Lihat seluruh deskripsi dan cara menggunakannya</div><div style="margin-top:12px;font-size:12px;font-weight:700">View project ↗</div>'+price+'</div>'}
["name","description","category","status","priceMin","priceMax","showPrice","imageAspectRatio"].forEach(id=>$(id).addEventListener("input",()=>renderLivePreview([...existingImages.map(p=>({url:storageUrl(p)})),...newFiles.map((f,i)=>({url:previewUrls[i]}))])));
$("images").addEventListener("change",()=>{previewUrls.forEach(URL.revokeObjectURL);previewUrls=[];const files=[...$("images").files];if(existingImages.length+files.length>15){say("saveStatus","Total foto maksimal 15. Kurangi pilihan foto.");$("images").value="";newFiles=[];renderPreview();return}if(files.some(f=>f.size>5*1024*1024||!["image/jpeg","image/png","image/webp"].includes(f.type))){say("saveStatus","Pastikan semua foto JPG/PNG/WebP dan maksimal 5 MB per foto.");$("images").value="";newFiles=[];renderPreview();return}newFiles=files;previewUrls=newFiles.map(URL.createObjectURL);renderPreview();say("saveStatus","")});
$("imagePreview").addEventListener("click",e=>{const b=e.target.closest("[data-remove]");if(!b)return;const i=Number(b.dataset.index);if(b.dataset.remove==="old")existingImages.splice(i,1);else{newFiles.splice(i,1);URL.revokeObjectURL(previewUrls[i]);previewUrls.splice(i,1)}renderPreview()});
async function loadCategories(){const {data,error}=await db.from("portfolio_categories").select("slug,label,sort_order,is_active").order("sort_order").order("label");if(error){say("categoryStatus","Gagal memuat kategori: "+error.message);return}categories=data||[];renderCategories()}
function renderCategories(){$("category").innerHTML=categories.filter(c=>c.is_active).map(c=>'<option value="'+esc(c.slug)+'">'+esc(c.label)+'</option>').join("");$("categoryList").innerHTML=categories.map(c=>'<div class="category-row"><input aria-label="Nama kategori" data-category-label="'+esc(c.slug)+'" value="'+esc(c.label)+'"><button class="admin-btn secondary" data-category-save="'+esc(c.slug)+'">Simpan</button><button class="admin-btn danger" data-category-delete="'+esc(c.slug)+'">Hapus</button></div>').join("")||'<div class="muted-note">Belum ada kategori.</div>'}
$("categoryForm").onsubmit=async e=>{e.preventDefault();const label=$("newCategory").value.trim(),slug=slugify(label);if(!slug){say("categoryStatus","Nama kategori tidak valid.");return}const {error}=await db.from("portfolio_categories").insert({slug,label,sort_order:categories.length});if(error){say("categoryStatus",error.message);return}$("newCategory").value="";say("categoryStatus","Kategori ditambahkan.");await loadCategories()};
$("categoryList").onclick=async e=>{const save=e.target.dataset.categorySave,del=e.target.dataset.categoryDelete;if(save){const input=$("categoryList").querySelector('[data-category-label="'+CSS.escape(save)+'"]');const {error}=await db.from("portfolio_categories").update({label:input.value.trim()}).eq("slug",save);say("categoryStatus",error?error.message:"Nama kategori diperbarui.");await loadCategories()}if(del&&confirm("Hapus kategori ini? Project yang masih memakai kategori ini harus dipindahkan dahulu.")){const {error}=await db.from("portfolio_categories").delete().eq("slug",del);say("categoryStatus",error?error.message:"Kategori dihapus.");await loadCategories()}};
async function loadProjects(){const {data,error}=await db.from("portfolio_projects").select("*").order("sort_order").order("created_at",{ascending:false});if(error){$("projectList").textContent=error.message;return}$("projectList").innerHTML=data.length?data.map(p=>'<div class="admin-item"><div><strong>'+esc(p.name)+'</strong><small>'+esc(categories.find(c=>c.slug===p.category)?.label||p.category)+' · '+esc(p.status)+' · '+((p.image_paths||[]).length|| (p.image_path?1:0))+' foto · '+(p.is_published?"Tampil":"Disembunyikan")+(p.is_private?" · Privat":"")+'</small></div><div class="admin-row"><button class="admin-btn secondary" data-edit="'+p.id+'">Edit</button><button class="admin-btn danger" data-delete="'+p.id+'">Hapus</button></div></div>').join(""):"Belum ada project."}
$("projectList").onclick=async e=>{const id=e.target.dataset.edit,del=e.target.dataset.delete;if(id){const {data,error}=await db.from("portfolio_projects").select("*").eq("id",id).single();if(error||!data)return;$("projectId").value=data.id;$("name").value=data.name;$("slug").value=data.slug;$("category").value=data.category;$("status").value=data.status;$("description").value=data.description||"";$("priceMin").value=data.price_min??"";$("priceMax").value=data.price_max??"";$("showPrice").checked=!!data.show_price;$("url").value=data.url||"";$("sortOrder").value=data.sort_order;$("imageAspectRatio").value=data.image_aspect_ratio||"16:9";$("privateProject").checked=!!data.is_private;$("published").checked=!!data.is_published;existingImages=data.image_paths?.length?[...data.image_paths]:(data.image_path?[data.image_path]:[]);newFiles=[];previewUrls.forEach(URL.revokeObjectURL);previewUrls=[];$("images").value="";renderPreview();$("formTitle").textContent="Edit project";window.scrollTo({top:0,behavior:"smooth"})}if(del&&confirm("Hapus project ini?")){const {data}=await db.from("portfolio_projects").select("image_path,image_paths").eq("id",del).single();const {error}=await db.from("portfolio_projects").delete().eq("id",del);if(error){say("saveStatus",error.message);return}const paths=[...(data?.image_paths||[]),...(data?.image_path?[data.image_path]:[])];if(paths.length)await db.storage.from("portfolio-projects").remove([...new Set(paths)]);loadProjects()}};
$("resetBtn").onclick=()=>{$("projectForm").reset();$("projectId").value="";existingImages=[];newFiles=[];previewUrls.forEach(URL.revokeObjectURL);previewUrls=[];$("images").value="";$("formTitle").textContent="Tambah project";$("published").checked=true;renderPreview()};
$("projectForm").onsubmit=async e=>{e.preventDefault();say("saveStatus","Menyimpan project...");if(existingImages.length+newFiles.length>15){say("saveStatus","Total foto maksimal 15.");return}let uploaded=[];for(const file of newFiles){const path=crypto.randomUUID()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"-");const {error}=await db.storage.from("portfolio-projects").upload(path,file,{upsert:false,contentType:file.type});if(error){say("saveStatus",error.message);return}uploaded.push(path)}const allImages=[...existingImages,...uploaded],statusValue=$("status").value;const payload={name:$("name").value.trim(),slug:slugify($("slug").value),category:$("category").value,category_label:categories.find(c=>c.slug===$("category").value)?.label||$("category").value,description:$("description").value.trim(),price_min:$("priceMin").value===""?null:Number($("priceMin").value),price_max:$("priceMax").value===""?null:Number($("priceMax").value),show_price:$("showPrice").checked,status:statusValue,status_type:statusValue==="Live"?"live":statusValue==="Completed"?"completed":"progress",url:$("url").value.trim(),image_paths:allImages,image_path:allImages[0]||null,image_aspect_ratio:$("imageAspectRatio").value,is_private:$("privateProject").checked,is_published:$("published").checked,featured:false,sort_order:Number($("sortOrder").value)||0,updated_at:new Date().toISOString()};const id=$("projectId").value;const result=id?await db.from("portfolio_projects").update(payload).eq("id",id):await db.from("portfolio_projects").insert(payload);if(result.error){say("saveStatus",result.error.message);return}const removed=(id?[]:[]);say("saveStatus","Project berhasil disimpan.");$("resetBtn").click();await loadProjects()};
db.auth.onAuthStateChange((_event,session)=>{if(!session){currentUser=null;showAuth()}});renderPreview();checkSession();
</script></body></html>
